name: Apply tactical fade patch

on:
  push:
    branches:
      - codex/tactical-fade-shadow-2026-07-25

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract remaining files
        shell: bash
        run: |
          set -euo pipefail
          cat v2/.patch/chunk_aa v2/.patch/chunk_ab v2/.patch/chunk_ac v2/.patch/chunk_ad \
            | base64 --decode > /tmp/remaining.tar.xz
          echo "f06944a5aa09f45c43dff435d7cf552e43381d9cbab932d33c6c92c4c91572ae  /tmp/remaining.tar.xz" \
            | sha256sum --check --strict
          tar -xJf /tmp/remaining.tar.xz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and run tests
        working-directory: v2
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A v2
          git rm -f \
            v2/.patch/chunk_aa \
            v2/.patch/chunk_ab \
            v2/.patch/chunk_ac \
            v2/.patch/chunk_ad \
            .github/workflows/apply-tactical-fade-patch.yml
          git commit -m "feat(v2): add fixed tactical fade shadow research"
          git push
