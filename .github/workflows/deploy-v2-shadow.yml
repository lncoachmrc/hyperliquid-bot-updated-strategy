name: Deploy V2 Shadow to Railway

on:
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/deploy-v2-shadow.yml"
  push:
    branches:
      - main
    paths:
      - "v2/**"
      - ".github/workflows/deploy-v2-shadow.yml"
  workflow_dispatch:

concurrency:
  group: deploy-v2-shadow-production
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate shadow-only V2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install V2 with test dependencies
        run: python -m pip install -q -e 'v2[dev]'

      - name: Compile V2
        run: python -m compileall -q v2/src v2/tests

      - name: Run V2 regression suite
        run: pytest -q v2/tests

      - name: Enforce non-executable safety boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          from unittest.mock import patch

          from hyperliquid_v2.runtime.settings import Settings

          forbidden_imports = ("hyperliquid.exchange", "eth_account")
          violations: list[str] = []

          for path in Path("v2/src").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.startswith(forbidden_imports):
                              violations.append(f"{path}: forbidden import {alias.name}")
                  elif isinstance(node, ast.ImportFrom):
                      module = node.module or ""
                      if module.startswith(forbidden_imports):
                          violations.append(f"{path}: forbidden import {module}")
                  elif isinstance(node, ast.Call) and node.args:
                      first = node.args[0]
                      if not isinstance(first, ast.Constant) or first.value != "PRIVATE_KEY":
                          continue
                      func = node.func
                      if isinstance(func, ast.Attribute) and func.attr in {"getenv", "get"}:
                          violations.append(f"{path}: PRIVATE_KEY environment access")
                  elif isinstance(node, ast.Subscript):
                      target = node.value
                      if (
                          isinstance(target, ast.Attribute)
                          and isinstance(target.value, ast.Name)
                          and target.value.id == "os"
                          and target.attr == "environ"
                          and isinstance(node.slice, ast.Constant)
                          and node.slice.value == "PRIVATE_KEY"
                      ):
                          violations.append(f"{path}: PRIVATE_KEY environment access")

          if violations:
              raise SystemExit("\n".join(violations))

          safe_env = {
              "DATABASE_URL": "postgresql://shadow:shadow@localhost:5432/shadow",
              "V2_WALLET_ADDRESS": "0x" + "0" * 40,
              "V2_SHADOW_ONLY": "true",
              "V2_LIVE_TRADING_ENABLED": "false",
              "V2_TACTICAL_FADE_SHADOW_ENABLED": "true",
          }
          with patch.dict(os.environ, safe_env, clear=True):
              settings = Settings.from_env()
              assert settings.shadow_only is True
              assert settings.live_trading_enabled is False
              assert settings.tactical_fade_shadow_enabled is True

          unsafe_env = dict(safe_env)
          unsafe_env["V2_LIVE_TRADING_ENABLED"] = "true"
          with patch.dict(os.environ, unsafe_env, clear=True):
              try:
                  Settings.from_env()
              except RuntimeError:
                  pass
              else:
                  raise AssertionError("V2 accepted live trading configuration")
          PY

  deploy:
    name: Deploy only v2-shadow
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Mark V2 shadow deployment pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg state pending \
            --arg context 'v2-shadow - hyperliquid-v2-shadow' \
            --arg description 'Validating and deploying isolated non-executable V2 shadow' \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            --data "$payload"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Railway project token
        shell: bash
        env:
          V2_RAILWAY_TOKEN: ${{ secrets.V2_RAILWAY_TOKEN }}
          FALLBACK_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          token="$V2_RAILWAY_TOKEN"
          if [[ -z "$token" ]]; then
            token="$FALLBACK_RAILWAY_TOKEN"
          fi
          if [[ -z "$token" ]]; then
            echo "::error::Missing V2_RAILWAY_TOKEN (preferred) or RAILWAY_TOKEN repository secret."
            exit 1
          fi
          echo "RAILWAY_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Reassert hard shadow variables
        shell: bash
        run: |
          set -euo pipefail
          railway variable set \
            --service v2-shadow \
            --environment production \
            V2_SHADOW_ONLY=true \
            V2_LIVE_TRADING_ENABLED=false \
            V2_TACTICAL_FADE_SHADOW_ENABLED=true \
            V2_ROUND_TRIP_COST_BPS=10

      - name: Upload and deploy only the V2 directory
        shell: bash
        run: |
          set -euo pipefail
          railway up v2 \
            --path-as-root \
            --service v2-shadow \
            --environment production

      - name: Record latest deployment state
        if: always()
        shell: bash
        run: |
          railway deployment list \
            --service v2-shadow \
            --environment production \
            --limit 1 \
            --json || true

      - name: Publish final V2 shadow deployment status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='V2 shadow deployment failed; V1 was not targeted'
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success
            description='V2 shadow deployed successfully with live trading disabled'
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg context 'v2-shadow - hyperliquid-v2-shadow' \
            --arg description "$description" \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            --data "$payload"
